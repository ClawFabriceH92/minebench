name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MINEBENCH_KEYSTORE_B64: ${{ secrets.MINEBENCH_KEYSTORE_B64 }}
      MINEBENCH_KEYSTORE_PASSWORD: ${{ secrets.MINEBENCH_KEYSTORE_PASSWORD }}
      MINEBENCH_KEY_ALIAS: ${{ secrets.MINEBENCH_KEY_ALIAS }}
      MINEBENCH_KEY_PASSWORD: ${{ secrets.MINEBENCH_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK with version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "minebench-v${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: minebench-apk
          path: minebench-v*.apk
          if-no-files-found: error

      - name: Publish "latest" release (push on main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=${{ steps.version.outputs.VERSION }}
          gh release delete latest --yes 2>/dev/null || true
          for i in 1 2 3 4 5; do
            gh release create latest "minebench-v${VER}.apk" --title "MineBench latest" \
              --notes "Build automatique de la branche main (v${VER})" && break
            sleep 10
          done

      - name: Publish versioned release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=${{ steps.version.outputs.VERSION }}
          gh release create "${GITHUB_REF_NAME}" "minebench-v${VER}.apk" \
            --title "MineBench ${GITHUB_REF_NAME}" \
            --notes "MineBench v${VER}" || gh release upload "${GITHUB_REF_NAME}" "minebench-v${VER}.apk" --clobber
